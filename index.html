    // Cadran d'accord : pourcentage à gauche, cadran au centre, serveur à droite.
    var mx = W * 0.05, bottom = H * 0.06;
    var gw = 270 * S, sw = Math.min(460 * S, W * 0.28);
    var g = $("gauche");
    g.style.left = Math.round(mx) + "px";
    g.style.bottom = Math.round(bottom + 26 * S) + "px";
    var cad = $("cadran");
    cad.style.left = Math.round(mx + gw + 36 * S) + "px";
    cad.style.width = Math.round(W - 2 * mx - gw - sw - 72 * S) + "px";
    cad.style.bottom = Math.round(bottom + 32 * S) + "px";
    var st = $("statut");
    st.style.left = cad.style.left;
    st.style.width = cad.style.width;
    st.style.bottom = Math.round(bottom) + "px";
    var sv = $("serveur");
    sv.style.right = Math.round(mx) + "px";
    sv.style.width = Math.round(sw) + "px";
    sv.style.bottom = Math.round(bottom + 26 * S) + "px";
    drawDial();
  }

  // Graduations du cadran (canvas : pas de dégradé CSS moderne requis).
  function drawDial() {
    var cv = $("cadranCv"), cad = $("cadran");
    var w = Math.max(100, cad.offsetWidth), h = Math.max(30, cad.offsetHeight);
    cv.width = w; cv.height = h;
    var x = cv.getContext("2d");
    x.clearRect(0, 0, w, h);
    var base = h - 18 * S, i;
    x.fillStyle = "rgba(221,241,245,.45)";
    x.fillRect(0, Math.round(base), w, 1);
    for (i = 0; i <= 50; i++) {
      var px = Math.round(i / 50 * (w - 2));
      var big = i % 5 === 0;
      x.fillStyle = big ? "rgba(221,241,245,.55)" : "rgba(221,241,245,.3)";
      x.fillRect(px, Math.round(base - (big ? 34 : 14) * S), big ? 2 : 1, Math.round((big ? 34 : 14) * S));
    }
    x.fillStyle = "#6A7C82";
    x.font = Math.round(12 * S) + "px 'PT Mono','Courier New',monospace";
    x.textBaseline = "bottom";
    for (i = 0; i <= 10; i++) {
      var t = String(i * 10), tw = x.measureText(t).width;
      var tx = i / 10 * (w - 2);
      x.fillText(t, Math.max(0, Math.min(w - tw, tx - tw / 2)), h);
    }
  }

  // ─── Effets : neige (images de bruit), lignes de balayage, vignette ─────────
  var N = { frames: [], f: 0, last: 0, fixe: 0.85, bursts: [] };
  function makeNoise() {
    var cv = $("neige"), ctx = cv.getContext("2d");
    for (var f = 0; f < 6; f++) {
      var id = ctx.createImageData(cv.width, cv.height), d = id.data, i;
      for (i = 0; i < d.length; i += 4) {
        var v = Math.random() * 255;
        d[i] = v * 0.7; d[i + 1] = v * 0.78; d[i + 2] = v * 0.82; d[i + 3] = 255;
      }
      for (var s = 0; s < 4; s++) { // quelques lignes plus claires, comme un vrai tube
        var y = (Math.random() * cv.height) | 0, add = 60 + Math.random() * 80;
        for (var xx = 0; xx < cv.width; xx++) {
          var j = (y * cv.width + xx) * 4;
          d[j] = Math.min(255, d[j] + add); d[j + 1] = Math.min(255, d[j + 1] + add); d[j + 2] = Math.min(255, d[j + 2] + add);
        }
      }
      N.frames.push(id);
    }
  }
  function burst(a, ms) { if (!reduced) N.bursts.push({ a: a, t0: now(), ms: ms }); }
  function noiseLoop() {
    raf(noiseLoop);
    var t = now();
    if (t - N.last < 40) return;
    N.last = t;
    var b = 0, keep = [];
    for (var i = 0; i < N.bursts.length; i++) {
      var x = N.bursts[i], k = 1 - (t - x.t0) / x.ms;
      if (k > 0) { b = Math.max(b, x.a * k); keep.push(x); }
    }
    N.bursts = keep;
    var level = reduced ? 0 : Math.min(1, Math.max(N.fixe, b));
    var cv = $("neige");
    cv.style.opacity = level.toFixed(3);
    if (level > 0.002) {
      N.f = (N.f + 1) % N.frames.length;
      cv.getContext("2d").putImageData(N.frames[N.f], 0, 0);
    }
  }
  function makeScanAndVignette() {
    var c = document.createElement("canvas");
    c.width = 1; c.height = 4;
    var x = c.getContext("2d");
    x.fillStyle = "rgba(0,0,0,.9)";
    x.fillRect(0, 2, 1, 2);
    $("scan").style.backgroundImage = "url(" + c.toDataURL() + ")";
    var v = document.createElement("canvas");
    v.width = 320; v.height = 180;
    var y = v.getContext("2d");
    var g = y.createRadialGradient(160, 90, 50, 160, 90, 190);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(0.55, "rgba(0,0,0,0)");
    g.addColorStop(1, "rgba(0,0,0,.92)");
    y.fillStyle = g;
    y.fillRect(0, 0, 320, 180);
    $("vignette").style.backgroundImage = "url(" + v.toDataURL() + ")";
  }

  // ─── Avancement : la ville sort de la neige ─────────────────────────────────
  function progress() {
    if (done) return 1;
    if (!total) return status ? 0.92 : 0;
    var p = needKnown ? (total - left) / total : 0;
    return Math.min(0.9, p * 0.9) + (status ? 0.08 : 0);
  }
  function render() {
    var p = progress(), d = dict();
    $("pct").innerHTML = Math.round(p * 100) + "<small>%</small>";
    $("aiguille").style.left = (p * 100).toFixed(1) + "%";
    var txt;
    if (status) txt = status;
    else if (file) txt = fmt(d.dl, { f: file, d: needKnown ? Math.max(0, total - left) : 0, t: total });
    else txt = d.search;
    $("statut").textContent = txt;
    N.fixe = done ? 0 : Math.max(0, 0.85 - p * 1.15); // la ville (et le logo) sortent de la neige ; les textes restent lisibles par-dessus
    $("scene").style.opacity = reduced ? (0.35 + p * 0.65).toFixed(2) : "1";
    if (needKnown && total > 0 && left <= 0 && !done) setTimeout(capte, 1500);
  }
  function capte() {
    if (done) return;
    done = true;
    render();
    $("aiguille").className = "capte";
    burst(0.5, 300);
    jitter($("ld"), 260);
    $("conseil").style.display = "none";
    var c = $("capte");
    c.style.display = "block";
    if (!reduced) { c.style.opacity = "0"; setTimeout(function () { c.style.opacity = "1"; }, 60); }
  }
  // Déchirure simplifiée : l'image saute de quelques pixels pendant ms (rien si réduit).
  function jitter(el, ms) {
    if (reduced) return;
    var t0 = now();
    (function step() {
      var k = 1 - (now() - t0) / ms;
      if (k <= 0) { el.style.webkitTransform = el.style.transform = ""; return; }
      var dx = Math.round((Math.random() * 2 - 1) * 40 * S * k);
      el.style.webkitTransform = el.style.transform = "translate(" + dx + "px,0)";
      raf(step);
    })();
  }

  // ─── Conseils : texte tapé ──────────────────────────────────────────────────
  function showTip(advance) {
    var tips = dict().tips;
    if (advance) tipIdx = (tipIdx + 1) % tips.length;
    var s = tips[tipIdx % tips.length], el = $("conseilTxt");
    clearInterval(typeTimer);
    if (reduced) { el.textContent = s; return; }
    var n = 0;
    el.innerHTML = '<span></span><i class="curseur"></i>';
    var span = el.firstChild;
    typeTimer = setInterval(function () {
      n += 1;
      span.textContent = s.substr(0, n);
      if (n >= s.length) { clearInterval(typeTimer); setTimeout(function () { if (el.lastChild && el.lastChild.className === "curseur") el.removeChild(el.lastChild); }, 900); }
    }, 1000 / CPS);
  }

  function setLang(code) {
    lang = forced || pickLang(code) || pickLang(navigator.language || navigator.userLanguage) || "en";
    document.documentElement.setAttribute("lang", lang);
    var d = dict(), els = document.querySelectorAll("[data-t]");
    for (var i = 0; i < els.length; i++) {
      var k = els[i].getAttribute("data-t");
      if (d[k] !== undefined) els[i].textContent = d[k];
    }
    updateServer();
    showTip(false);
    render();
  }
  function updateServer() {
    var parts = [];
    if (mapName) parts.push(mapName);
    if (maxPlayers > 0) parts.push(fmt(dict().seats, { n: maxPlayers }));
    $("carte").textContent = parts.length ? parts.join(" · ") : "—";
  }

  /* Rappels appelés par Garry's Mod */
  window.GameDetails = function (servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language) {
    called = true;
    try {
      if (servername) $("srv").textContent = servername;
      mapName = String(mapname || "");
      maxPlayers = parseInt(maxplayers, 10) || 0;
      setLang(language);
    } catch (e) {}
  };
  window.SetStatusChanged = function (s) {
    called = true;
    status = String(s || "");
    if (/lua/i.test(status) && !done) setTimeout(capte, 1200);
    render();
  };
  window.SetFilesTotal = function (t) {
    called = true;
    total = parseInt(t, 10) || 0;
    if (left > total) left = total;
    render();
  };
  window.SetFilesNeeded = function (n) {
    called = true;
    needKnown = true;
    left = parseInt(n, 10) || 0;
    if (total && left > total) total = left;
    render();
  };
  window.DownloadingFile = function (name) {
    called = true;
    file = String(name || "").replace(/^.*[\\\/]/, "");
    status = "";
    render();
  };

  /* Mode aperçu : aucun appel de GMod au bout de 2 s, on simule un chargement. */
  function preview() {
    if (called) return;
    window.GameDetails("Purge War Reborn", "", "rp_stalker_new", 64, "76561198012345678", "purgewar", 1,
      queryLang() || navigator.language || "fr");
    var names = ["materials/purgewar/kinescope/snow_3.png", "resource/fonts/PWKinescope-Regular.ttf",
      "models/weapons/w_gsr_m4.mdl", "sound/purgewar/signal.wav", "materials/purgewar/picto/key.png", "maps/rp_stalker_new.bsp"];
    var T = 1206, n = T;
    window.SetFilesTotal(T);
    window.SetFilesNeeded(n);
    var iv = setInterval(function () {
      n = Math.max(0, n - (20 + Math.round(Math.random() * 60)));
      window.DownloadingFile(names[Math.floor(Math.random() * names.length)]);
      if (Math.random() < 0.12) burst(0.25, 160);
      if (n === 0) {
        clearInterval(iv);
        window.SetStatusChanged(dict().sim1);
        setTimeout(function () { window.SetStatusChanged(dict().sim2); }, 1000);
      }
      window.SetFilesNeeded(n);
    }, 220);
  }

  makeNoise();
  makeScanAndVignette();
  layout();
  window.onresize = layout;
  forced = queryLang();
  setLang(null);
  noiseLoop();
  setInterval(function () { showTip(true); }, TIP_MS);
  setTimeout(preview, 2000);
  // Les polices intégrées arrivent après le premier rendu : on redessine le cadran.
  setTimeout(drawDial, 600);
}());
</script>
